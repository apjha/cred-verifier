[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cred-verifier"
version = "0.1.0"
description = "Tools for custodians of privileged accounts who rotate credentials manually"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cred-exposure = "credverifier.exposure:main"
cred-passgen = "credverifier.passgen:main"

[tool.setuptools]
packages = ["credverifier"]
